[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fablescan"
version = "0.1.0"
description = "Audit prompts and skills for patterns that fight Claude Fable 5.2 prompting guidance."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "claude", "fable", "prompt", "skills", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/fablescan"
Repository = "https://github.com/perron/fablescan"
Issues = "https://github.com/perron/fablescan/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fablescan = "fablescan.cli:main"

[tool.setuptools.packages.find]
include = ["fablescan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
